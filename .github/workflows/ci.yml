name: StockPilot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: API contract and generated types
        run: npm run api:check

      - name: Unit tests
        run: npm run test -- --run

      - name: Production build
        run: npm run build

  readonly-api-smoke:
    if: ${{ vars.STOCKPILOT_API_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read-only API smoke test
        env:
          STOCKPILOT_API_BASE_URL: ${{ vars.STOCKPILOT_API_BASE_URL }}
        shell: pwsh
        run: ./scripts/verify-backend-readonly.ps1 -BaseUrl $env:STOCKPILOT_API_BASE_URL
